<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fine Arts Project 1 - Connor's Portfolio</title>
    <meta name="description" content="A collection of sculpture work by Connor Hubin.">
    <meta property="og:title" content="Sculpture - Connor's Portfolio">
    <meta property="og:description" content="A collection of sculpture work by Connor Hubin.">
    <meta property="og:image" content="https://deovv8pnl76k0.cloudfront.net/images/sculptures/1.png">
    <meta property="og:type" content="website">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        body[data-page="fine-arts"] {
            padding-top: 64px;
            background: #fafaf8;
        }

        body[data-page="fine-arts"] .site-header {
            display: none !important;
        }

        body[data-page="fine-arts"] .category-bar {
            top: 0 !important;
            position: fixed !important;
            z-index: 1002 !important;
        }

        .painting-gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 40px;
            padding: 80px 40px;
            background: #fafaf8;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery-item {
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .gallery-item:hover {
            transform: translateY(-8px);
        }

        .gallery-item-image {
            width: 100%;
            height: auto;
            display: block;
            aspect-ratio: 1;
            border-radius: 0;
            object-fit: cover;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            transition: box-shadow 0.3s ease;
        }

        .gallery-item:hover .gallery-item-image {
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }

        .project-gallery {
            display: none;
        }

        .project-header p {
            display: none;
        }

        /* Gallery Modal */
        .gallery-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .gallery-modal.is-open {
            opacity: 1;
            pointer-events: auto;
        }

        .gallery-modal-backdrop {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            cursor: pointer;
        }

        .gallery-modal-content {
            position: relative;
            z-index: 2001;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 90vw;
            max-height: 90vh;
            background: none;
            /* The image fills this whole box (see below), so without this,
               clicks on any letterboxed space around it hit this wrapper
               instead of passing through to the backdrop's close handler. */
            pointer-events: none;
        }

        .gallery-modal-content img {
            max-width: 90vw;
            max-height: 90vh;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 0;
        }

        .gallery-modal-back {
            position: absolute;
            top: 20px;
            left: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border: none;
            background: none;
            padding: 0;
            cursor: pointer;
            color: #fff;
            transition: opacity 0.2s ease;
            z-index: 2002;
        }

        /* The modal fades out via opacity (not display:none, since that can't
           be transitioned) - without scoping these to .is-open, the img/button
           keep pointer-events:auto even while invisible and silently block
           clicks/scroll on the real page underneath wherever they last sat. */
        .gallery-modal.is-open .gallery-modal-content img,
        .gallery-modal.is-open .gallery-modal-back {
            pointer-events: auto;
        }

        .gallery-modal-back:hover {
            opacity: 0.7;
        }

        .gallery-modal-back svg {
            width: 30px;
            height: 30px;
            stroke-width: 3;
        }

        /* Tablet */
        @media (max-width: 1024px) {
            .painting-gallery {
                grid-template-columns: repeat(2, 1fr);
                gap: 32px;
                padding: 60px 30px;
            }
        }

        /* Mobile */
        @media (max-width: 768px) {
            .painting-gallery {
                grid-template-columns: 1fr;
                gap: 24px;
                padding: 60px 20px;
            }

            .gallery-modal-back {
                top: 16px;
                left: 16px;
                width: 38px;
                height: 38px;
            }

            .gallery-modal-back svg {
                width: 24px;
                height: 24px;
            }
        }

        /* Small phones */
        @media (max-width: 480px) {
            .painting-gallery {
                grid-template-columns: 1fr;
                gap: 16px;
                padding: 60px 16px;
            }

            .gallery-modal-back {
                top: 12px;
                left: 12px;
                width: 34px;
                height: 34px;
            }

            .gallery-modal-back svg {
                width: 20px;
                height: 20px;
            }
        }
    </style>
</head>
<body data-page="fine-arts">
    <header class="site-header">
        <div class="header-inner container">
            <h1 class="site-name"><a href="index.html">Connor Hubin</a></h1>
            <nav class="header-nav">
                <a href="about.html" class="nav-about" title="Details">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="10.5"/>
                        <circle cx="12" cy="8" r="1.5"/>
                        <path d="M12 11v6"/>
                    </svg>
                </a>
            </nav>
        </div>
    </header>

    <nav class="category-bar" aria-label="Top categories">
        <a href="portfolio-wheel.html#industrial-design" data-category="industrial-design">Industrial Design</a>
        <a href="portfolio-wheel.html#engineering" data-category="engineering">Engineering</a>
        <a href="portfolio-wheel.html#fabrication" data-category="fabrication">Fabrication</a>
        <a href="portfolio-wheel.html#fine-arts" data-category="fine-arts">Fine Arts</a>
    </nav>

    <div class="project-header" style="padding-left: 40px;">
        <h1>Sculpture</h1>
        <p>Three-dimensional sculptural works</p>
    </div>

    <div class="painting-gallery" id="painting-gallery">
        <!-- Gallery items will be generated by JavaScript -->
    </div>

    <div class="gallery-modal" id="gallery-modal" aria-hidden="true">
        <div class="gallery-modal-backdrop" id="gallery-modal-backdrop"></div>
        <div class="gallery-modal-content" role="dialog" aria-modal="true" aria-label="Sculpture Viewer">
            <button class="gallery-modal-back" id="back-gallery-modal" aria-label="Back to Gallery">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 19l-7-7 7-7"></path>
                </svg>
            </button>
            <img id="modal-image" src="" alt="Full size sculpture view">
        </div>
    </div>

    <div class="project-gallery">
        <div class="gallery-item placeholder"><div>Image 1</div></div>
        <div class="gallery-item placeholder"><div>Image 2</div></div>
        <div class="gallery-item placeholder"><div>Image 3</div></div>
    </div>

    <script>
        const galleryData = [
         { image: 'https://deovv8pnl76k0.cloudfront.net/images/sculptures/1.png', fallback: 'assets/images/sculptures/1.png', title: 'Sculpture 1', description: '' },
         { image: 'https://deovv8pnl76k0.cloudfront.net/images/sculptures/2-b.png', fallback: 'assets/images/sculptures/2-b.png', title: 'Sculpture 2', description: '' },
         { image: 'https://deovv8pnl76k0.cloudfront.net/images/sculptures/3.JPG', fallback: 'assets/images/sculptures/3.JPG', title: 'Sculpture 3', description: '' },
         { image: 'https://deovv8pnl76k0.cloudfront.net/images/sculptures/4.JPG', fallback: 'assets/images/sculptures/4.JPG', title: 'Sculpture 4', description: '' },
         { image: 'https://deovv8pnl76k0.cloudfront.net/images/sculptures/5.JPG', fallback: 'assets/images/sculptures/5.JPG', title: 'Sculpture 5', description: '' },
         { image: 'https://deovv8pnl76k0.cloudfront.net/images/sculptures/6.JPG', fallback: 'assets/images/sculptures/6.JPG', title: 'Sculpture 6', description: '' },
         { image: 'https://deovv8pnl76k0.cloudfront.net/images/sculptures/7.png', fallback: 'assets/images/sculptures/7.png', title: 'Sculpture 7', description: '' },
         { image: 'https://deovv8pnl76k0.cloudfront.net/images/sculptures/8.png', fallback: 'assets/images/sculptures/8.png', title: 'Sculpture 8', description: '' },
         { image: 'https://deovv8pnl76k0.cloudfront.net/images/sculptures/9.png', fallback: 'assets/images/sculptures/9.png', title: 'Sculpture 9', description: '' },
         { image: 'https://deovv8pnl76k0.cloudfront.net/images/sculptures/10.JPG', fallback: 'assets/images/sculptures/10.JPG', title: 'Sculpture 10', description: '' }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            const gallery = document.getElementById('painting-gallery');
            const modal = document.getElementById('gallery-modal');
            const modalImage = document.getElementById('modal-image');
            const backdrop = document.getElementById('gallery-modal-backdrop');
            const backButton = document.getElementById('back-gallery-modal');

            // Generate gallery items
            galleryData.forEach((item, index) => {
                const galleryItem = document.createElement('div');
                galleryItem.className = 'gallery-item';
                galleryItem.innerHTML = `
                    <img class="gallery-item-image" src="${item.image}" alt="${item.title}">
                `;

                galleryItem.addEventListener('click', () => {
                    modalImage.src = item.image;
                    modalImage.alt = item.title;
                    modal.classList.add('is-open');
                    modal.setAttribute('aria-hidden', 'false');
                    document.body.style.overflow = 'hidden';
                });

                gallery.appendChild(galleryItem);
            });

            // Modal controls
            const closeModal = () => {
                modal.classList.remove('is-open');
                modal.setAttribute('aria-hidden', 'true');
                document.body.style.overflow = '';
            };

            backButton.addEventListener('click', closeModal);
            backdrop.addEventListener('click', closeModal);

            // Escape key to close
            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape' && modal.classList.contains('is-open')) {
                    closeModal();
                }
            });
        });
    </script>

    <script src="script.js?v=20260308b"></script>

</body>
</html>
