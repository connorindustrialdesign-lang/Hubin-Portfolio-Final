    <style>
      .portfolio-wrap { max-width: 1400px; margin: 0 auto; padding: 60px 20px; }
      .portfolio-header { text-align: center; margin-bottom: 50px; }
      .portfolio-header h1 { font-size: 42px; margin: 0 0 12px 0; font-weight: 700; }
      .portfolio-header p { font-size: 18px; color: var(--muted); margin: 0 0 20px 0; }
      .back-link { display: inline-block; padding: 10px 20px; background: #000; color: #fff; text-decoration: none; border-radius: 6px; font-size: 14px; transition: background 0.3s; margin-bottom: 40px; }
      .back-link:hover { background: #333; }
      
      .drawings-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
      .drawing-item { aspect-ratio: 3 / 4; background: #f5f5f5; border-radius: 0; overflow: hidden; cursor: pointer; transition: transform 0.3s; }
      .drawing-item:hover { transform: scale(1.02); }
      .drawing-item img { width: 100%; height: 100%; object-fit: cover; display: block; }

      .drawing-modal { position: fixed; inset: 0; display: none; z-index: 5000; }
      .drawing-modal.is-open { display: block; }
      .drawing-modal-backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.88); }
      .drawing-modal-back { position: absolute; top: 20px; left: 20px; display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: none; background: none; padding: 0; cursor: pointer; z-index: 3; color: #fff; }
      .drawing-modal-back:hover { opacity: 0.7; }
      .drawing-modal-back svg { width: 30px; height: 30px; stroke-width: 3; }
      .drawing-modal-content {
        position: relative;
        z-index: 2;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 84px 20px 20px;
        box-sizing: border-box;
        /* Fills the whole screen just to center the image - without this,
           clicks on the black space around the image hit this wrapper
           instead of passing through to the backdrop's close handler. */
        pointer-events: none;
      }
      .drawing-modal-content img {
        max-width: calc(100vw - 40px);
        max-height: calc(100vh - 120px);
        width: auto;
        height: auto;
        object-fit: contain;
        display: block;
        border-radius: 0;
        background: #fff;
        pointer-events: auto;
      }

      @media (max-width: 1024px) { .drawings-grid { grid-template-columns: repeat(2, 1fr); } }
      @media (max-width: 768px) {
        .drawings-grid { grid-template-columns: 1fr; }
        .drawing-modal-back { top: 12px; left: 12px; width: 38px; height: 38px; }
        .drawing-modal-back svg { width: 24px; height: 24px; }
        .drawing-modal-content { padding: 72px 14px 14px; }
        .drawing-modal-content img { max-width: calc(100vw - 28px); max-height: calc(100vh - 98px); }
      }
    </style>

    <script>
        (function () {
            const modal = document.getElementById('drawing-modal');
            const modalImage = document.getElementById('drawing-modal-image');
            const backButton = document.getElementById('drawing-modal-back');
            const backdrop = document.getElementById('drawing-modal-backdrop');
            const drawingImages = document.querySelectorAll('.drawing-item img');

            if (!modal || !modalImage || !backButton || !backdrop || !drawingImages.length) return;

            const openModal = (img) => {
                modalImage.src = img.currentSrc || img.src;
                modalImage.alt = img.alt || 'Drawing full screen';
                modal.classList.add('is-open');
                modal.setAttribute('aria-hidden', 'false');
                document.body.style.overflow = 'hidden';
            };

            const closeModal = () => {
                modal.classList.remove('is-open');
                modal.setAttribute('aria-hidden', 'true');
                modalImage.src = '';
                document.body.style.overflow = '';
            };

            drawingImages.forEach((img) => {
                img.addEventListener('click', () => openModal(img));
            });

            backButton.addEventListener('click', closeModal);
            backdrop.addEventListener('click', closeModal);

            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape' && modal.classList.contains('is-open')) {
                    closeModal();
                }
            });
        })();
    </script>
