    <style>
      body[data-page="home"] {
        background: #fafaf8;
        padding-top: 152px;
      }
      .hero-project {
        min-height: 60vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 20px 40px;
      }
      .hero-project-wrapper {
        max-width: 1200px;
        width: 100%;
        margin: 0 auto;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 40px;
        align-items: start;
      }
      .hero-project-image {
        width: 100%;
        max-width: 600px;
      }
      .hero-project-image img {
        width: 100%;
        height: auto;
        border-radius: 0;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        display: block;
      }
      .hero-project-text {
        font-size: 32px;
        font-weight: 700;
        color: #1a1a1a;
        text-align: left;
        margin-top: 24px;
        margin-bottom: 12px;
      }
      .hero-project-caption {
        font-size: 16px;
        font-weight: 400;
        color: #222;
        line-height: 1.6;
        letter-spacing: 1.2px;
        text-align: left;
        max-width: 340px;
        margin: 8px 0 0 0;
      }
      .projects-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 20px 40px;
        background: #1a1a1a;
        color: #fff;
        text-decoration: none;
        font-weight: 700;
        font-size: 38px;
        letter-spacing: 0.5px;
        border-radius: 8px;
        transition: background 0.3s ease, transform 0.2s ease;
        border: none;
        cursor: pointer;
        width: fit-content;
        margin-top: 0;
      }
      .projects-button:hover {
        background: #333;
        transform: translateY(-2px);
      }
      .hero-project-button-side {
        align-self: center;
      }
      @media (max-width: 1024px) {
        .hero-project-wrapper {
          grid-template-columns: 1fr;
          gap: 24px;
        }
      }
      @media (max-width: 768px) {
        /* Fit the whole hero (image + title + caption + button) in the
           viewport with no scrolling and no cropping. The image is full-bleed
           (no side margin) and fills all remaining height after the button's
           own space is taken out; title/caption are overlaid on the image's
           top-left corner instead of taking up their own space. object-fit:
           contain keeps the whole photo visible (never crops), so depending
           on the available height/width ratio a small letterbox gap can show
           on the sides - that's the image's own natural shape, not a margin.
           display:contents on .hero-project-image lets its child (.hero-top-row)
           become a direct flex item of the wrapper instead of being boxed. */
        .hero-project {
          height: calc(100vh - 140px);
          min-height: calc(100vh - 140px);
          max-height: calc(100vh - 140px);
          padding: 0 0 max(14px, env(safe-area-inset-bottom));
          align-items: stretch;
          overflow: hidden;
        }
        .hero-project-wrapper {
          display: flex;
          flex-direction: column;
          height: 100%;
          width: 100%;
        }
        .hero-project-image {
          display: contents;
        }
        .hero-top-row {
          flex: 1 1 auto;
          min-height: 0;
          width: 100%;
          position: relative;
        }
        .hero-top-row a {
          position: absolute;
          inset: 0;
          display: block;
        }
        .hero-top-row a img {
          width: 100%;
          height: 100%;
          object-fit: contain;
          display: block;
          border-radius: 0;
        }
        .hero-text-col {
          position: absolute;
          top: 16px;
          left: 16px;
          z-index: 2;
          max-width: 70%;
          background: rgba(255, 255, 255, 0.88);
          padding: 10px 14px;
          border-radius: 12px;
        }
        .hero-project-text {
          font-size: 22px;
          margin-top: 0;
          margin-bottom: 0;
          color: #1a1a1a;
        }
        .hero-project-caption {
          font-size: 12px;
          max-width: none;
          margin-top: 8px;
          margin-bottom: 0;
          color: #1a1a1a;
        }
        .projects-button {
          font-size: 24px;
          padding: 14px 36px;
          border-radius: 16px;
        }
        .hero-project-button-side {
          flex: 0 0 auto;
          display: flex;
          justify-content: center;
          width: 100%;
          margin-top: 12px;
        }
        .hero-project-button-side .projects-button {
          width: 100%;
          max-width: 320px;
        }
      }
    </style>
