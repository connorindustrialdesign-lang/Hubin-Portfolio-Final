    <link rel="stylesheet" href="styles.css">
    <style>
      body[data-page="home"] {
        background: #fafaf8;
        padding-top: 152px;
      }
      .hero-project {
        min-height: 60vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 20px 40px;
      }
      .hero-project-wrapper {
        max-width: 1200px;
        width: 100%;
        margin: 0 auto;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 40px;
        align-items: start;
      }
      .hero-project-image {
        width: 100%;
        max-width: 600px;
      }
      .hero-project-image img {
        width: 100%;
        height: auto;
        border-radius: 8px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        display: block;
      }
      .hero-project-text {
        font-size: 32px;
        font-weight: 700;
        color: #1a1a1a;
        text-align: left;
        margin-top: 24px;
        margin-bottom: 12px;
      }
      .hero-project-caption {
        font-size: 16px;
        font-weight: 400;
        color: #222;
        line-height: 1.6;
        letter-spacing: 1.2px;
        text-align: left;
        max-width: 340px;
        margin: 8px 0 0 0;
      }
      .projects-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 28px 64px;
        background: #1a1a1a;
        color: #fff;
        text-decoration: none;
        font-weight: 700;
        font-size: 24px;
        letter-spacing: 0.5px;
        border-radius: 8px;
        transition: background 0.3s ease, transform 0.2s ease;
        border: none;
        cursor: pointer;
        width: fit-content;
        margin-top: 0;
      }
      .projects-button:hover {
        background: #333;
        transform: translateY(-2px);
      }
      .hero-project-button-side {
        align-self: center;
      }
      @media (max-width: 1024px) {
        .hero-project-wrapper {
          grid-template-columns: 1fr;
          gap: 24px;
        }
      }
      @media (max-width: 768px) {
        /* Fit the whole hero (image + title + caption + button) in the
           viewport with no scrolling and no cropping. Title (left) and
           caption (right) share a row spanning the image's width, with the
           Portfolio button centered in its own full-width row below.
           display:contents on .hero-project-image lets its children (the
           picture link, title, caption) become direct grid items of the
           wrapper instead of being boxed inside it. */
        .hero-project {
          height: calc(100vh - 140px);
          min-height: calc(100vh - 140px);
          max-height: calc(100vh - 140px);
          padding: 12px 8px 10px;
          align-items: stretch;
          overflow: hidden;
        }
        .hero-project-wrapper {
          display: grid;
          grid-template-columns: auto 1fr;
          grid-template-rows: minmax(0, 1fr) auto auto;
          grid-template-areas:
            "image image"
            "title caption"
            "button button";
          column-gap: 16px;
          row-gap: 6px;
          height: 100%;
          width: 100%;
        }
        .hero-project-image {
          display: contents;
        }
        .hero-project-image a {
          grid-area: image;
          height: 100%;
          aspect-ratio: 2000 / 2550;
          width: auto;
          max-width: 100%;
          margin: 0 auto;
          justify-self: center;
          min-height: 0;
          min-width: 0;
          position: relative;
          display: block;
          overflow: hidden;
          border-radius: 16px;
        }
        .hero-project-image img {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          object-fit: cover;
          border-radius: 16px;
        }
        .hero-project-text {
          grid-area: title;
          align-self: center;
          margin-top: 0;
          margin-bottom: 0;
        }
        .hero-project-caption {
          grid-area: caption;
          align-self: center;
          font-size: 12px;
          max-width: none;
          margin-top: 0;
          margin-bottom: 0;
        }
        .projects-button {
          font-size: 18px;
          padding: 18px 36px;
          border-radius: 16px;
        }
        .hero-project-button-side {
          grid-area: button;
          display: flex;
          justify-content: center;
          width: 100%;
          margin-top: -3px;
        }
        .hero-project-button-side .projects-button {
          width: 100%;
          max-width: 320px;
        }
      }
    </style>
