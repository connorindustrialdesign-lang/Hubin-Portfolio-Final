<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Connor Hubin — Portfolio</title>
    <meta name="description" content="Portfolio of Connor Hubin, an industrial designer and fabricator based in Walla Walla, WA, spanning product design, engineering, fabrication, and fine arts.">
    <meta property="og:title" content="Connor Hubin — Portfolio">
    <meta property="og:description" content="Portfolio of Connor Hubin, an industrial designer and fabricator based in Walla Walla, WA, spanning product design, engineering, fabrication, and fine arts.">
    <meta property="og:image" content="https://deovv8pnl76k0.cloudfront.net/images/id-project-a/ID%20project%20A%20hero%20shot%20%28homepage%29-v2.JPG">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="styles.css?v=20260903">
    <style>
      body[data-page="home"] {
        background: #fff;
        padding-top: 152px;
      }
      .hero-project {
        min-height: 60vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 20px 40px;
      }
      .hero-project-wrapper {
        max-width: 1200px;
        width: 100%;
        margin: 0 auto;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 40px;
        align-items: start;
      }
      .hero-project-image {
        width: 100%;
        max-width: 600px;
      }
      .hero-project-image img {
        width: 100%;
        height: auto;
        border-radius: 0;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        display: block;
      }
      .hero-project-text {
        font-size: 32px;
        font-weight: 700;
        color: #1a1a1a;
        text-align: left;
        margin-top: 24px;
        margin-bottom: 12px;
      }
      .hero-project-caption {
        font-size: 16px;
        font-weight: 400;
        color: #222;
        line-height: 1.6;
        letter-spacing: 1.2px;
        text-align: left;
        max-width: 340px;
        margin: 8px 0 0 0;
      }
      .projects-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 20px 40px;
        background: #1a1a1a;
        color: #fff;
        text-decoration: none;
        font-weight: 700;
        font-size: 38px;
        letter-spacing: 0.5px;
        border-radius: 8px;
        transition: background 0.3s ease, transform 0.2s ease;
        border: none;
        cursor: pointer;
        width: fit-content;
        margin-top: 0;
      }
      .projects-button:hover {
        background: #333;
        transform: translateY(-2px);
      }
      .hero-project-button-side {
        align-self: center;
      }
      @media (max-width: 1024px) {
        .hero-project-wrapper {
          grid-template-columns: 1fr;
          gap: 24px;
        }
      }
      @media (min-width: 1025px) {
        /* Unwrap the image/text nesting so the image, title, and caption can
           each be placed independently on the grid - lets the button sit in
           its own row at the bottom of the second column, bottom-aligned
           with the image, with the title/caption stacked directly above it. */
        .hero-project-image,
        .hero-top-row,
        .hero-text-col {
          display: contents;
        }
        .hero-project-wrapper {
          grid-template-rows: 1fr auto auto auto;
          row-gap: 0;
          align-items: stretch;
        }
        .hero-top-row a {
          grid-column: 1;
          grid-row: 1 / -1;
          display: block;
          width: 100%;
          max-width: 600px;
        }
        .hero-project-text {
          grid-column: 2;
          grid-row: 2;
          margin-top: 0;
        }
        .hero-project-caption {
          grid-column: 2;
          grid-row: 3;
          margin-top: 0;
        }
        .hero-project-button-side {
          grid-column: 2;
          grid-row: 4;
          align-self: end;
          justify-self: start;
          margin-top: 28px;
        }
      }
      @media (max-width: 768px) {
        /* Prevent iOS rubber-band overscroll bounce from revealing a gap
           above/below the fixed header+category bar - content comfortably
           fits within one screen now that the button floats over the image,
           so there's no legitimate need for this page to scroll at all.
           html ALSO needs this, not just body - otherwise html itself can
           still rubber-band independently, and during that bounce the
           position:fixed header/category bar (fixed to the viewport) can
           visually detach from the rest of the page, which is what made
           this feel broken/disconnected instead of one solid page. This
           is scoped to index.html's own <style> block, so it only affects
           this page's <html> element, not any other page's. */
        html {
          height: 100%;
          overflow: hidden;
        }
        body[data-page="home"] {
          height: 100dvh;
          overflow: hidden;
        }
        /* Full-bleed image, sized purely by its own natural aspect ratio via
           plain block flow (width:100%, height:auto) rather than a fixed-
           height flex/JS calculation - this guarantees the image is always
           full width and never internally letterboxed or shrunk, at the
           cost of allowing the page to scroll a little on shorter devices
           if the natural image height doesn't leave room for the button
           within one screen. title/caption are overlaid on the image's
           top-left corner instead of taking up their own space. */
        .hero-project {
          padding: 0 0 max(14px, env(safe-area-inset-bottom));
        }
        .hero-project-wrapper {
          display: flex;
          flex-direction: column;
          width: 100%;
          gap: 0;
          position: relative;
        }
        .hero-project-image {
          display: contents;
        }
        .hero-top-row {
          width: 100%;
          position: relative;
        }
        .hero-top-row a {
          display: block;
          width: 100%;
        }
        .hero-top-row a img {
          width: 100%;
          height: auto;
          display: block;
          border-radius: 0;
          box-shadow: none;
        }
        .hero-text-col {
          position: absolute;
          top: 100px;
          left: 16px;
          z-index: 2;
          max-width: 70%;
        }
        .hero-project-text {
          font-size: 22px;
          margin-top: 0;
          margin-bottom: 0;
          color: #1a1a1a;
        }
        .hero-project-caption {
          font-size: 12px;
          line-height: 1.25;
          max-width: none;
          margin-top: 3px;
          margin-bottom: 0;
          color: #D4A017;
        }
        .projects-button {
          font-size: 21px;
          padding: 10px 22px;
          border-radius: 14px;
          box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
        }
        .hero-project-button-side {
          position: absolute;
          right: 16px;
          bottom: 8px;
          z-index: 3;
        }
        .hero-project-button-side .projects-button {
          width: auto;
          max-width: none;
        }
      }
    </style>
  </head>
