    <style>
        .project-gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 40px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .gallery-item {
            aspect-ratio: auto;
            overflow: visible;
            border-radius: 10px;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 250px;
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            object-fit: contain;
            display: block;
        }

        .gallery-item.placeholder {
            background: linear-gradient(135deg, #C97171 0%, #d98989 100%);
            color: white;
            font-weight: 600;
            text-align: center;
            padding: 20px;
        }

        .gallery-item.full-width {
            grid-column: 1 / -1;
        }

        .project-header {
            padding: 60px 40px 40px;
            text-align: center;
        }

        .project-header h1 {
            font-size: 48px;
            margin: 0 0 10px 0;
            font-weight: 700;
        }

        .project-header p {
            font-size: 18px;
            color: #666;
            margin: 0;
        }

        .back-link {
            display: inline-block;
            padding: 10px 20px;
            background: #000;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
            margin: 40px;
            transition: background 0.3s;
        }

        .back-link:hover {
            background: #333;
        }

        @media (max-width: 1024px) {
            .project-gallery {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
                padding: 30px;
            }

            .project-header {
                padding: 50px 30px 30px;
            }

            .project-header h1 {
                font-size: 40px;
            }

            .project-header p {
                font-size: 16px;
            }
        }

        @media (max-width: 768px) {
            .project-gallery {
                grid-template-columns: 1fr;
                gap: 12px;
                padding: 20px;
            }

            .gallery-item.full-width {
                grid-column: 1;
            }

            .project-header {
                padding: 40px 20px 20px;
            }

            .project-header h1 {
                font-size: 32px;
            }

            .project-header p {
                font-size: 16px;
            }

            .gallery-item {
                min-height: 200px;
            }

            /* Hero video (mobile only): keep the original larger gap under the
               video - the 16px gap above is a desktop-only tightening. */
            .mero-hero-video-wrap {
                margin-bottom: 48px !important;
            }

            /* Header (mobile only): title stacked directly above its caption
               text, both centered and fit within the screen - matches the
               Carte page treatment. */
            .mero-header-row {
                flex-direction: column !important;
                align-items: center !important;
                justify-content: flex-start !important;
                width: 100% !important;
                max-width: 100% !important;
                box-sizing: border-box !important;
                padding: 32px 20px 24px !important;
                text-align: center !important;
            }
            .mero-header-title {
                font-size: 56px !important;
                text-align: center !important;
            }
            .mero-header-text {
                text-align: left !important;
                font-size: 15px !important;
                margin-top: 20px !important;
            }
        }

        @media (max-width: 480px) {
            .project-gallery {
                grid-template-columns: 1fr;
                gap: 10px;
                padding: 16px;
            }

            .project-header {
                padding: 30px 16px 16px;
            }

            .project-header h1 {
                font-size: 24px;
                margin: 0 0 8px 0;
            }

            .project-header p {
                font-size: 14px;
            }

            .gallery-item {
                min-height: 160px;
                padding: 12px;
            }

            .gallery-item.placeholder {
                padding: 12px;
            }

            .mero-header-title {
                font-size: 48px !important;
            }
            .mero-header-text {
                font-size: 14px !important;
            }
        }
    </style>
</head>
